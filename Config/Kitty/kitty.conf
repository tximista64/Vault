include current-theme.conf


font_family      JetBrainsMono Nerd Font Mono
font_size 9.0
shell zsh --login
background_opacity 0.82

# Ghostty-style animated cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

# Look and feel
tab_bar_style powerline
# Split border defaults to kitty's stock green; match the violet accent
active_border_color #b875dc
inactive_border_color #4a2f70
copy_on_select yes
confirm_os_window_close 0
scrollback_lines 10000
shell_integration no-title
enable_audio_bell no
# Browse scrollback buffer in nvim
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -
map kitty_mod+z show_scrollback
