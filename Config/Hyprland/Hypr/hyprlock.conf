# Catppuccin Mocha (Mauve accent) - matches mako / cursor theme / yazi flavor

$base    = rgb(1e1e2e)
$text    = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$accent  = rgb(cba6f7)
$red     = rgb(f38ba8)

background {
    monitor =
    path = /home/tximi/Progz/Vault/Config/Nixos/assets/Lock.png
    color = $base
    # blur was tuned for the old flat-color background (invisible on a solid
    # color); left on, it smears the artwork now used here, so it's off.
    blur_passes = 0
    noise = 0.02
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = $base
    font_color = $accent
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Mot de passe...</span>
    fail_color = $red
    fail_text = <span foreground="##f38ba8">$FAIL <b>($ATTEMPTS)</b></span>
    position = 0, -120
    halign = center
    valign = center
}
